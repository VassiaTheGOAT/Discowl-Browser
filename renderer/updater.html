<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'"/>
  <title>Discowl</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 420px;
      height: 240px;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      -webkit-app-region: drag;
    }

    /* ── Logo + titre ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #0cc0df, #ffde59);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }

    .brand-version {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    /* ── Zone statut ── */
    .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 300px;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      min-height: 16px;
      transition: opacity 0.2s;
    }

    /* ── Barre de progression ── */
    .progress-wrap {
      width: 100%;
      height: 4px;
      background: #1e2330;
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .progress-wrap.visible { opacity: 1; }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0cc0df, #ffde59);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* Indéterminé (checking…) */
    .progress-bar.indeterminate {
      width: 30%;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="../assets/logo-discowl.png" class="logo" alt="Discowl" draggable="false"/>
    <div class="brand">
      <div class="brand-name">Discowl</div>
      <div class="brand-version" id="ver">v—</div>
    </div>
  </div>

  <div class="status-area">
    <div class="status-text" id="status">Checking for updates…</div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar indeterminate" id="progress-bar"></div>
    </div>
  </div>

  <script>
    const statusEl   = document.getElementById('status');
    const wrapEl     = document.getElementById('progress-wrap');
    const barEl      = document.getElementById('progress-bar');
    const verEl      = document.getElementById('ver');

    function setStatus(txt) { statusEl.textContent = txt; }

    function showIndeterminate() {
      wrapEl.classList.add('visible');
      barEl.classList.add('indeterminate');
      barEl.style.width = '';
    }

    function showProgress(pct) {
      wrapEl.classList.add('visible');
      barEl.classList.remove('indeterminate');
      barEl.style.width = pct + '%';
    }

    function hideProgress() {
      wrapEl.classList.remove('visible');
    }

    // Lire la version depuis l'API
    window.updaterAPI?.getVersion().then(v => {
      verEl.textContent = 'v' + v;
    });

    // Démarrer en mode indéterminé
    showIndeterminate();

    // Écouter les événements du main process
    window.updaterAPI?.onStatus((event) => {
      switch (event.type) {

        case 'checking':
          setStatus('Checking for updates…');
          showIndeterminate();
          break;

        case 'not-available':
          setStatus('Up to date. Launching…');
          hideProgress();
          break;

        case 'available':
          setStatus(`Update ${event.version} available — downloading…`);
          showProgress(0);
          break;

        case 'progress':
          setStatus(`Downloading update ${event.version}… ${event.percent}%`);
          showProgress(event.percent);
          break;

        case 'downloaded':
          setStatus(`Update ${event.version} ready — installing…`);
          showProgress(100);
          break;

        case 'error':
          setStatus('Update check failed — launching…');
          hideProgress();
          break;
      }
    });
  </script>
</body>
</html>
