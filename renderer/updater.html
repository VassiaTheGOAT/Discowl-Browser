<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;"/>
  <title>Discowl</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 480px;
      height: 300px;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Branding ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 36px;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(12,192,223,.3));
      flex-shrink: 0;
    }

    .brand { display: flex; flex-direction: column; gap: 3px; }

    .brand-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0cc0df 0%, #ffde59 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .brand-tagline {
      font-size: 11.5px;
      color: #475569;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    .brand-version {
      font-size: 10px;
      color: #2d3748;
      letter-spacing: 0.6px;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Panel de progression ────────────────────────────── */
    .dl-panel {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Row statut + pourcentage */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 18px;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .25s;
    }
    .status-text.ok    { color: #34d399; }
    .status-text.error { color: #f87171; }

    .status-pct {
      font-size: 12.5px;
      font-weight: 600;
      color: #0cc0df;
      min-width: 44px;
      text-align: right;
      opacity: 0;
      transition: opacity .2s;
      font-variant-numeric: tabular-nums;
    }
    .status-pct.show { opacity: 1; }

    /* Barre de progression */
    .progress-track {
      width: 100%;
      height: 5px;
      background: #1a2035;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      transition: opacity .3s;
    }
    .progress-track.show { opacity: 1; }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0cc0df, #38bdf8 50%, #ffde59);
      background-size: 200% 100%;
      border-radius: 3px;
      transition: width .25s ease;
    }

    .progress-fill.spin {
      width: 30%;
      animation: indeterminate 1.6s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0%   { transform: translateX(-200%); }
      100% { transform: translateX(600%);  }
    }

    /* Métadonnées : vitesse + taille */
    .meta-row {
      display: flex;
      justify-content: space-between;
      min-height: 15px;
    }

    .meta-speed, .meta-size {
      font-size: 10.5px;
      color: #2d3748;
      opacity: 0;
      transition: opacity .2s;
      font-variant-numeric: tabular-nums;
    }
    .meta-speed.show, .meta-size.show { opacity: 1; }

    /* Row installation */
    .install-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 15px;
      opacity: 0;
      transition: opacity .3s;
    }
    .install-row.show { opacity: 1; }

    .spinner {
      width: 12px;
      height: 12px;
      border: 1.5px solid #1e293b;
      border-top-color: #0cc0df;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .install-text {
      font-size: 10.5px;
      color: #475569;
    }

    /* Hint lancement sans MAJ */
    .launch-hint {
      font-size: 10.5px;
      color: #334155;
      text-align: center;
      opacity: 0;
      transition: opacity .3s;
    }
    .launch-hint.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="header">
    <img
      src="../assets/logo-discowl.png"
      class="logo"
      alt=""
      draggable="false"
      onerror="this.style.display='none'"
    />
    <div class="brand">
      <div class="brand-name">Discowl</div>
      <div class="brand-tagline">Private Browser</div>
      <div class="brand-version" id="ver">—</div>
    </div>
  </div>

  <div class="dl-panel">
    <div class="status-row">
      <div class="status-text" id="status">Starting…</div>
      <div class="status-pct"  id="pct"></div>
    </div>

    <div class="progress-track" id="track">
      <div class="progress-fill spin" id="fill"></div>
    </div>

    <div class="meta-row">
      <div class="meta-speed" id="speed"></div>
      <div class="meta-size"  id="size"></div>
    </div>

    <div class="install-row" id="install-row">
      <div class="spinner"></div>
      <div class="install-text">Applying update…</div>
    </div>

    <div class="launch-hint" id="launch-hint">
      Launching without update…
    </div>
  </div>

  <script>
    /* ── Références DOM ───────────────────────────────── */
    const els = {
      ver:        document.getElementById('ver'),
      status:     document.getElementById('status'),
      pct:        document.getElementById('pct'),
      track:      document.getElementById('track'),
      fill:       document.getElementById('fill'),
      speed:      document.getElementById('speed'),
      size:       document.getElementById('size'),
      installRow: document.getElementById('install-row'),
      launchHint: document.getElementById('launch-hint'),
    };

    /* ── Formatage octets ─────────────────────────────── */
    function fmt(b) {
      if (!b || b <= 0) return '';
      if (b < 1024)     return b + ' B';
      if (b < 1048576)  return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    /* ── Mise à jour de l'état de l'UI ───────────────── */
    function setState(text, opts = {}) {
      // Texte de statut
      els.status.className = 'status-text' + (opts.cls ? ' ' + opts.cls : '');
      els.status.textContent = text;

      // Pourcentage
      if (opts.pct !== undefined) {
        els.pct.textContent = opts.pct + '%';
        els.pct.classList.add('show');
      } else {
        els.pct.classList.remove('show');
      }

      // Barre de progression
      if (opts.spin) {
        els.track.classList.add('show');
        els.fill.classList.add('spin');
        els.fill.style.width = '';
      } else if (opts.pct !== undefined) {
        els.track.classList.add('show');
        els.fill.classList.remove('spin');
        els.fill.style.width = opts.pct + '%';
      } else {
        els.track.classList.remove('show');
        els.fill.classList.remove('spin');
      }

      // Vitesse
      if (opts.speed) {
        els.speed.textContent = fmt(opts.speed) + '/s';
        els.speed.classList.add('show');
      } else {
        els.speed.classList.remove('show');
      }

      // Taille transférée / totale
      if (opts.total) {
        els.size.textContent = fmt(opts.xfer) + ' / ' + fmt(opts.total);
        els.size.classList.add('show');
      } else {
        els.size.classList.remove('show');
      }

      // Spinner installation
      els.installRow.classList.toggle('show', !!opts.installing);

      // Hint lancement sans MAJ
      els.launchHint.classList.toggle('show', !!opts.hint);
    }

    /* ── Chargement de la version ─────────────────────── */
    window.updaterAPI?.getVersion().then(v => {
      if (v) els.ver.textContent = 'v' + v;
    });

    // État initial
    setState('Checking for updates…', { spin: true });

    /* ── Calcul de la vitesse (EMA) ───────────────────── */
    let _lastBytes = 0;
    let _lastTime  = Date.now();
    let _speed     = 0; // EMA lissée

    /* ── Événements updater ───────────────────────────── */
    window.updaterAPI?.onStatus(e => {
      switch (e.type) {

        case 'checking':
          setState('Checking for updates…', { spin: true });
          break;

        case 'not-available':
          setState('Already up to date', { cls: 'ok' });
          break;

        case 'available':
          setState(`Update ${e.version} found — downloading…`, { pct: 0 });
          _lastBytes = 0;
          _lastTime  = Date.now();
          _speed     = 0;
          break;

        case 'progress': {
          const now = Date.now();
          const dt  = (now - _lastTime) / 1000;
          if (dt > 0.35) {
            const raw = (e.transferred - _lastBytes) / dt;
            _speed     = _speed * 0.6 + raw * 0.4; // EMA
            _lastBytes = e.transferred;
            _lastTime  = now;
          }
          setState(`Downloading Discowl ${e.version || ''}…`, {
            pct:  e.percent,
            speed: Math.round(_speed),
            xfer:  e.transferred,
            total: e.total,
          });
          break;
        }

        case 'downloaded':
          setState(`Update ${e.version} ready — installing…`, {
            pct:       100,
            installing: true,
          });
          break;

        case 'timeout':
          setState('No connection — launching…', { cls: 'error', hint: true });
          break;

        case 'error':
          setState('Update failed — launching…', { cls: 'error', hint: true });
          break;
      }
    });
  </script>
</body>
</html>
