<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;"/>
  <title>Discowl</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 520px;
      height: 340px;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }

    .logo {
      width: 80px; height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(12,192,223,.3));
      flex-shrink: 0;
    }

    .brand { display: flex; flex-direction: column; gap: 4px; }

    .brand-name {
      font-size: 30px; font-weight: 700; letter-spacing: -0.6px; line-height: 1;
      background: linear-gradient(135deg, #0cc0df 0%, #ffde59 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .brand-tagline { font-size: 12px; color: #475569; letter-spacing: 0.3px; margin-top: 3px; }
    .brand-version { font-size: 10.5px; color: #2d3748; letter-spacing: 0.6px; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .dl-panel { width: 420px; display: flex; flex-direction: column; gap: 10px; }

    .status-row { display: flex; align-items: center; justify-content: space-between; min-height: 20px; }

    .status-icon { font-size: 14px; flex-shrink: 0; margin-right: 8px; opacity: 0; transition: opacity .2s; }
    .status-icon.show { opacity: 1; }

    .status-text { font-size: 13px; color: #94a3b8; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .25s; }
    .status-text.ok     { color: #34d399; }
    .status-text.error  { color: #f87171; }
    .status-text.active { color: #e2e8f0; font-weight: 500; }

    .status-pct { font-size: 13px; font-weight: 700; color: #0cc0df; min-width: 48px; text-align: right; opacity: 0; transition: opacity .2s; font-variant-numeric: tabular-nums; }
    .status-pct.show { opacity: 1; }

    .progress-track { width: 100%; height: 8px; background: #1a2035; border-radius: 4px; overflow: hidden; opacity: 0; transition: opacity .3s; }
    .progress-track.show { opacity: 1; }

    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #0cc0df, #38bdf8 50%, #ffde59);
      border-radius: 4px; transition: width .3s ease; position: relative;
    }
    .progress-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      animation: shimmer 2s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }

    .progress-fill.spin { width: 35%; animation: indeterminate 1.8s ease-in-out infinite; }
    .progress-fill.spin::after { display: none; }
    @keyframes indeterminate { 0% { transform: translateX(-200%); } 100% { transform: translateX(500%); } }

    .meta-row { display: flex; justify-content: space-between; align-items: center; min-height: 16px; }
    .meta-left { display: flex; align-items: center; gap: 12px; }

    .meta-speed { font-size: 11px; color: #64748b; opacity: 0; transition: opacity .2s; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
    .meta-speed.show { opacity: 1; }
    .meta-speed::before { content: '\2193'; color: #0cc0df; font-size: 10px; }

    .meta-size { font-size: 11px; color: #64748b; opacity: 0; transition: opacity .2s; font-variant-numeric: tabular-nums; }
    .meta-size.show { opacity: 1; }

    .install-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 0 2px; opacity: 0; transition: opacity .3s; }
    .install-row.show { opacity: 1; }

    .spinner { width: 14px; height: 14px; border: 2px solid #1e293b; border-top-color: #0cc0df; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .install-text { font-size: 11.5px; color: #475569; }

    .launch-hint { font-size: 11px; color: #334155; text-align: center; opacity: 0; transition: opacity .3s; padding-top: 4px; }
    .launch-hint.show { opacity: 1; }

    .steps { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
    .step-dot { width: 5px; height: 5px; border-radius: 50%; background: #1e293b; transition: background .25s, transform .25s; }
    .step-dot.active { background: #0cc0df; transform: scale(1.5); }
    .step-dot.done   { background: #34d399; }
  </style>
</head>
<body>

  <div class="header">
    <img src="../assets/logo-discowl.png" class="logo" alt="" draggable="false" onerror="this.style.display='none'"/>
    <div class="brand">
      <div class="brand-name">Discowl</div>
      <div class="brand-tagline">Private Browser</div>
      <div class="brand-version" id="ver">&#8212;</div>
    </div>
  </div>

  <div class="dl-panel">
    <div class="status-row">
      <span class="status-icon" id="icon"></span>
      <div class="status-text" id="status">Checking for updates&#8230;</div>
      <div class="status-pct"  id="pct"></div>
    </div>

    <div class="progress-track" id="track">
      <div class="progress-fill spin" id="fill"></div>
    </div>

    <div class="meta-row">
      <div class="meta-left">
        <div class="meta-speed" id="speed"></div>
        <div class="meta-size"  id="size"></div>
      </div>
    </div>

    <div class="install-row" id="install-row">
      <div class="spinner"></div>
      <div class="install-text">Applying update &#8212; please wait&#8230;</div>
    </div>

    <div class="launch-hint" id="launch-hint">Launching without update&#8230;</div>

    <div class="steps">
      <div class="step-dot active" id="step-check"></div>
      <div class="step-dot"        id="step-dl"></div>
      <div class="step-dot"        id="step-install"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const els = {
      ver: $('ver'), icon: $('icon'), status: $('status'), pct: $('pct'),
      track: $('track'), fill: $('fill'), speed: $('speed'), size: $('size'),
      installRow: $('install-row'), launchHint: $('launch-hint'),
      stepCheck: $('step-check'), stepDl: $('step-dl'), stepInstall: $('step-install'),
    };

    function fmt(b) {
      if (!b || b <= 0) return '';
      if (b < 1024)    return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function setStep(s) {
      els.stepCheck.className = els.stepDl.className = els.stepInstall.className = 'step-dot';
      if (s === 'check')   { els.stepCheck.className   = 'step-dot active'; }
      if (s === 'dl')      { els.stepCheck.className   = 'step-dot done'; els.stepDl.className = 'step-dot active'; }
      if (s === 'install') { els.stepCheck.className   = 'step-dot done'; els.stepDl.className = 'step-dot done'; els.stepInstall.className = 'step-dot active'; }
      if (s === 'done')    { els.stepCheck.className   = els.stepDl.className = els.stepInstall.className = 'step-dot done'; }
    }

    function setState(text, opts = {}) {
      els.status.className   = 'status-text' + (opts.cls ? ' ' + opts.cls : '');
      els.status.textContent = text;
      els.icon.textContent   = opts.icon || '';
      els.icon.classList.toggle('show', !!opts.icon);

      if (opts.pct !== undefined) { els.pct.textContent = opts.pct + '%'; els.pct.classList.add('show'); }
      else els.pct.classList.remove('show');

      if (opts.spin) {
        els.track.classList.add('show'); els.fill.classList.add('spin'); els.fill.style.width = '';
      } else if (opts.pct !== undefined) {
        els.track.classList.add('show'); els.fill.classList.remove('spin'); els.fill.style.width = opts.pct + '%';
      } else {
        els.track.classList.remove('show'); els.fill.classList.remove('spin');
      }

      if (opts.speed) { els.speed.textContent = fmt(opts.speed) + '/s'; els.speed.classList.add('show'); }
      else els.speed.classList.remove('show');

      if (opts.total) { els.size.textContent = fmt(opts.xfer) + ' / ' + fmt(opts.total); els.size.classList.add('show'); }
      else els.size.classList.remove('show');

      els.installRow.classList.toggle('show', !!opts.installing);
      els.launchHint.classList.toggle('show', !!opts.hint);
    }

    window.updaterAPI?.getVersion().then(v => { if (v) els.ver.textContent = 'v' + v; });
    setState('Checking for updates…', { spin: true });
    setStep('check');

    let _lb = 0, _lt = Date.now(), _spd = 0;

    window.updaterAPI?.onStatus(e => {
      switch (e.type) {
        case 'checking':
          setState('Checking for updates…', { spin: true });
          setStep('check');
          break;
        case 'not-available':
          setState('Already up to date', { cls: 'ok', icon: '✓' });
          setStep('done');
          break;
        case 'available':
          setState('Update ' + e.version + ' available — starting download…', { cls: 'active', pct: 0 });
          setStep('dl'); _lb = 0; _lt = Date.now(); _spd = 0;
          break;
        case 'progress': {
          const now = Date.now(), dt = (now - _lt) / 1000;
          if (dt > 0.35) { _spd = _spd * 0.6 + ((e.transferred - _lb) / dt) * 0.4; _lb = e.transferred; _lt = now; }
          const pct = Math.max(0, Math.min(100, Math.round(e.percent || 0)));
          setState('Downloading Discowl ' + (e.version || '') + '…', { cls: 'active', pct, speed: Math.round(_spd), xfer: e.transferred, total: e.total });
          setStep('dl');
          break;
        }
        case 'downloaded':
          setState('Update ' + e.version + ' downloaded — installing…', { cls: 'active', pct: 100, installing: true });
          setStep('install');
          break;
        case 'timeout':
          setState('No connection — launching…', { cls: 'error', icon: '⚠', hint: true });
          setStep('check');
          break;
        case 'error':
          setState('Update failed — launching…', { cls: 'error', icon: '✕', hint: true });
          setStep('check');
          break;
      }
    });
  </script>
</body>
</html>
